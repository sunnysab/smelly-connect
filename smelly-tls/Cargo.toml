[package]
name = "smelly-tls"
version = "0.1.0"
edition = "2024"

[lib]
name = "smelly_tls"
path = "src/lib.rs"

[[example]]
name = "probe"
path = "examples/probe.rs"
required-features = ["tokio"]

[dependencies]
der = "0.7"
hmac = "0.12"
hex = "0.4"
md-5 = "0.10"
rc4 = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rsa = "0.9"
rustls-native-certs = "0.8"
sha1 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "time"], optional = true }
webpki-roots = "1"
x509-cert = "0.2"

[features]
default = []
tokio = ["dep:tokio"]
