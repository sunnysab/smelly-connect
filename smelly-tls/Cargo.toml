[package]
name = "smelly-tls"
version = "0.5.0"
edition = "2024"

[lib]
name = "smelly_tls"
path = "src/lib.rs"

[[example]]
name = "probe"
path = "examples/probe.rs"
required-features = ["tokio"]

[dependencies]
der = { version = "0.8", features = ["alloc"] }
hmac = "0.13"
hex = "0.4"
md-5 = "0.11"
rc4 = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
rsa = "0.9"
rustls-native-certs = "0.8"
sha1 = "0.11"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "time"], optional = true }
webpki-roots = "1"
x509-cert = "0.3.0-rc.4"

[features]
default = []
test-utils = []
tokio = ["dep:tokio", "dep:reqwest"]
