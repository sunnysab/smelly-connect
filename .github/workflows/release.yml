name: Release CLI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build CLI
        run: cargo build --release --locked -p smelly-connect-cli --features management-api
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package dist
          cp target/release/smelly-connect-cli README.md config.toml.example package/
          tar -czf "dist/smelly-connect-cli-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" -C package .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path target/release/smelly-connect-cli.exe, README.md, config.toml.example -DestinationPath "dist/smelly-connect-cli-${env:RELEASE_TAG}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: smelly-connect-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  upload:
    name: Upload Release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smelly-connect-cli-*
          path: dist
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
