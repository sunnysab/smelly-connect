services:
  smelly-connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: smelly-connect-cli:latest
    restart: unless-stopped
    volumes:
      - ./config.toml:/etc/smelly-connect/config.toml:ro
    command:
      - --config
      - /etc/smelly-connect/config.toml
      - proxy
    ports:
      - "8080:8080"
      - "1080:1080"
      - "9090:9090"
