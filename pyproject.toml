[project]
name = "smelly-connect-tools"
version = "0.1.0"
description = "Operational scripts for smelly-connect"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
